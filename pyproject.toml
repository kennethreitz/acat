[project]
name = "acat-player"
version = "0.1.1"
description = "audio $ cat: play audio files the way cat prints text."
readme = "README.md"
license = "ISC"
authors = [
    { name = "Kenneth Reitz", email = "me@kennethreitz.org" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "sounddevice>=0.5.6",
]

[project.scripts]
acat = "acat.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = "acat"
